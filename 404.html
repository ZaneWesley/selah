<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Selah</title>
<meta name="description" content="This page took a pause. Head back to Selah.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F8F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Tokens mirror theme.js (LIGHT / DARK) so this page looks like the app. */
:root{
  --bg:#F8F6F2; --surface:#FFFFFF; --text:#1C2522; --muted:#788580;
  --sage:#6A8775; --rose:#A77A78; --sky:#7FA3BF; --border:#E5ECE7; --danger:#C4534E;
  --glass:rgba(255,255,255,.82); --glass-border:rgba(28,37,34,.10); --glass-hi:rgba(255,255,255,.9);
  --wash-sage:#9FD3B4; --wash-sky:#9CC6EE; --wash-rose:#F4B6B1;
  --a-sage:.55; --a-sky:.6; --a-rose:.42;
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --serif:'Newsreader',"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121614; --surface:#1D2421; --text:#EEF2EF; --muted:#95A39C;
    --sage:#7FA28C; --rose:#C58F8C; --sky:#7FA7C9; --border:#2C3532; --danger:#E0726C;
    --glass:rgba(29,36,33,.84); --glass-border:rgba(255,255,255,.16); --glass-hi:rgba(255,255,255,.35);
    --wash-sage:#3E8F66; --wash-sky:#3E78B8; --wash-rose:#B8605B;
    --a-sage:.28; --a-sky:.34; --a-rose:.2;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0;letter-spacing:-.01em}
p{margin:0}
a{color:var(--sage);text-underline-offset:3px}
code{font:.86em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:color-mix(in srgb,var(--sage) 14%,transparent);padding:.12em .4em;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Animated background: three soft washes that drift slowly, like the app. */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.bg .a{width:56vmax;height:56vmax;left:-14vmax;top:-18vmax;background:var(--wash-sage);opacity:var(--a-sage);animation:d1 38s ease-in-out infinite alternate}
.bg .b{width:50vmax;height:50vmax;right:-16vmax;top:8vmax;background:var(--wash-sky);opacity:var(--a-sky);animation:d2 44s ease-in-out infinite alternate}
.bg .c{width:46vmax;height:46vmax;left:18vmax;bottom:-24vmax;background:var(--wash-rose);opacity:var(--a-rose);animation:d3 50s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(9vmax,7vmax) rotate(40deg)}}
@keyframes d2{to{transform:translate(-8vmax,10vmax) rotate(-30deg)}}
@keyframes d3{to{transform:translate(-10vmax,-6vmax) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}html{scroll-behavior:auto}}

/* Floating glass pill nav */
nav.pill{position:sticky;top:14px;z-index:10;display:flex;justify-content:center;pointer-events:none;margin-top:14px}
nav.pill .in{pointer-events:auto;display:flex;gap:2px;align-items:center;padding:6px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 8px 30px rgba(0,0,0,.08);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
nav.pill .in::-webkit-scrollbar{display:none}
nav.pill a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
nav.pill a:hover{color:var(--text);background:color-mix(in srgb,var(--sage) 14%,transparent)}
nav.pill a.login{background:color-mix(in srgb,var(--sage) 16%,transparent);color:var(--text)}
nav.pill a.logo{font-family:var(--serif);font-size:18px;color:var(--text);padding:6px 14px}

/* Hero */
.hero{padding:88px 0 56px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--serif);font-size:clamp(30px,4vw,38px);font-weight:600;color:var(--sage)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
.hero h1{font-size:clamp(40px,7vw,72px);margin:14px auto 0;max-width:15ch}
.hero h1 em{font-style:italic;font-weight:400;color:var(--sage)}
.hero p.lead{font-size:clamp(17px,2.2vw,20px);color:var(--muted);max-width:56ch;margin:22px auto 0}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--sage);color:#fff;box-shadow:0 6px 20px color-mix(in srgb,var(--sage) 40%,transparent)}
.btn.primary:hover{box-shadow:0 8px 26px color-mix(in srgb,var(--sage) 55%,transparent)}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--glass-border)}
.meaning{margin:30px auto 0;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted);max-width:46ch}
.meaning b{font-style:normal;color:var(--text)}

section{padding:56px 0}
.promo{display:block;max-width:560px;text-align:center;text-decoration:none;font-size:14px;line-height:1.5;color:var(--text);padding:10px 18px;border-radius:var(--r-lg);background:color-mix(in srgb,var(--sage) 12%,transparent);border:1px solid color-mix(in srgb,var(--sage) 30%,transparent)}
.promo span{color:var(--muted)}.promo em{font-style:normal;font-weight:700;color:var(--sage)}
.sec-head{text-align:center;margin-bottom:34px}
.sec-head h2{font-size:clamp(28px,4vw,40px)}
.sec-head p{color:var(--muted);max-width:58ch;margin:12px auto 0}

/* Cards */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px}
.card h3{font-size:22px;margin:12px 0 8px}
.card p,.card li{color:var(--muted);font-size:15px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card li b{color:var(--text);font-weight:600}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.sage{--c:var(--sage)} .rose{--c:var(--rose)} .sky{--c:var(--sky)}
.verb .num{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--c)}
.vhead{display:flex;align-items:center;gap:12px;margin:10px 0 8px}
.vhead h3{margin:0}


/* Steps */
.steps{counter-reset:s;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.step{counter-increment:s;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;position:relative}
.step::before{content:counter(s,decimal-leading-zero);font-family:var(--serif);font-size:30px;color:var(--sage);display:block;margin-bottom:6px}
.step h3{font-size:20px;margin-bottom:6px}
.step p{color:var(--muted);font-size:15px}

/* Table */
.tablecard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:13px 20px;vertical-align:top}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:color-mix(in srgb,var(--sage) 7%,transparent)}
tr+tr td{border-top:1px solid var(--border)}
td:first-child{font-weight:600;width:36%}
td:last-child{color:var(--muted)}

/* Quote band */
.quote{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(22px,3vw,30px);line-height:1.4;text-align:center;max-width:30ch;margin:0 auto;color:var(--text)}
.quote small{display:block;font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:14px;font-style:normal}

/* FAQ */
details{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:0 22px;margin-bottom:10px}
summary{cursor:pointer;list-style:none;padding:18px 0;font-weight:700;display:flex;justify-content:space-between;gap:16px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none;margin-top:-4px}
details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
details .body{padding:0 0 18px;color:var(--muted);font-size:15px}
details .body p+p,details .body ul,details .body pre{margin-top:10px}
details .body ul{padding-left:20px}
pre{background:color-mix(in srgb,var(--text) 6%,transparent);border-radius:var(--r-sm);padding:14px 16px;overflow-x:auto;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text)}

.notice{display:flex;gap:16px;align-items:flex-start;background:color-mix(in srgb,var(--rose) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--rose) 30%,var(--border));border-radius:var(--r-lg);padding:22px 24px}
.notice .ico{--c:var(--rose)}
.notice h3{font-size:20px;margin-bottom:4px}
.notice p{color:var(--muted);font-size:15px}
.notice p b{color:var(--text)}

footer{padding:40px 0 64px;text-align:center;color:var(--muted);font-size:14px}
footer .logo{font-family:var(--serif);font-size:24px;color:var(--text)}
footer a{margin:0 8px}
@media (max-width:560px){
  .hero{padding:64px 0 36px} section{padding:40px 0} th,td{padding:12px 14px} td:first-child{width:auto}
  .g2{grid-template-columns:1fr}
}

body{min-height:100vh;display:grid;place-items:center;padding:24px}
.nf{width:100%;max-width:460px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:36px 28px}
.nf .ico{margin:0 auto}
.nf .code{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--sage);margin-top:18px}
.nf h1{font-size:clamp(30px,6vw,34px);margin-top:8px}
.nf p{color:var(--muted);margin-top:12px}
.nf .def{font-family:var(--serif);font-style:italic;font-size:15px;margin-top:18px}
.nf .def i{font-style:normal}
.nf .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
</style>
</head>
<body>

  <h1>This page took a pause.</h1>
  <p>We couldn't find what you were looking for. It may have moved, or the link may be mistyped.</p>
  <p class="def">sel·ah <i>(noun)</i> a pause; a moment to stop and consider.</p>
  <div class="row">
    <a class="btn primary" href="/">Back to Selah</a>

</body>
</html>
