<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>סלח</title>
</head>
<body>

<div class="app-shell">

    <div class="onboarding-overlay" id="onboardingWizard">
        <div class="onboarding-card">
            <div class="onboarding-card-header">
                <div class="ob-step-dot active"></div>
                <div class="ob-step-dot"></div>
                <div class="ob-step-dot"></div>
            </div>
            <div id="onboardingScreenBody"></div>
            <div class="ob-card">
                <button id="obBackBtn">Back</button>
                <button id="obNextBtn">Next</button>
            </div>
        </div>
    </div>
    
    <div class="floating-header">
        <div class="header-side-action">
            <button class="back-btn" id="backBtn" style="display: none;" aria-label="Back">
                <span class="material-symbols-rounded">arrow_back_ios_new</span>
            </button>
        </div>
        <h1 id="mainAppHeaderTitle">Selah</h1>
        <div class="header-side-action">
            <button class="delete-btn" id="deleteBtn" style="display: none;" aria-label="Delete">
                <span class="material-symbols-rounded">delete</span>
            </button>
        </div>
    </div>
    
    <div class="view-portal">
        
        <div class="view-home active" id="viewHome">
            <div class="gateway-screen" id="gatewayScreen">
                <h2 class="gateway-title">How do you want to process?</h2>
                <div class="gateway-options">
                    <button class="mode-card-option" id="chooseChatBtn">
                        <span class="material-symbols-rounded">3p</span>
                        <div>
                            <h4>Talk It Out</h4>
                            <p>Talk to a friend and process together.</p>
                        </div>
                    </button>
                    <button class="mode-card-option" id="chooseSoloBtn">
                        <span class="material-symbols-rounded">edit_document</span>
                        <div>
                            <h4>Just Write</h4>
                            <p>A quiet, private space to just write.</p>
                        </div>
                    </button>
                </div>
            </div>

            <div class="timeline-feed" id="timelineFeed" style="display: none;"></div>
        </div>

        <div class="view-chat" id="viewChat">
            <div class="message-area" id="messageArea"></div>
            <textarea id="soloJournalBox" placeholder="Dump your thoughts here..."></textarea>
            
            <div class="floating-bottom-wrapper">
                <div id="bannerContainer"></div>
                <div class="input-area" id="inputAreaPanel">
                    <input type="text" id="userInput" placeholder="Dump your thoughts..." autocomplete="off">
                    <button id="sendBtn" aria-label="Send">
                        <span class="material-symbols-rounded">arrow_upward_alt</span>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <button class="fab" id="fabBtn" aria-label="Toggle View">
        <span class="material-symbols-rounded">auto_stories</span>
    </button>

</div>

<script src="script.js"></script>
</body>
</html>
